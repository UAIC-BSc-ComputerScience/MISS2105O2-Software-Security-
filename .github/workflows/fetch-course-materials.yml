name: Fetch official course materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-course-materials.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download currently available official lecture PDFs
        shell: bash
        run: |
          set -u
          mkdir -p materials
          base='https://edu.info.uaic.ro/securitate-software'
          status='materials/FETCH_STATUS.md'
          printf '# Fetch status\n\nFetched from the official course page on %s UTC.\n\n| File | HTTP | Result |\n| --- | ---: | --- |\n' "$(date -u +'%Y-%m-%d %H:%M')" > "$status"

          declare -A files=(
            ['Set-UID_Progs_Attacks.pdf']="$base/Set-UID_Progs_Attacks.pdf"
            ['Env_Vars_Attacks.pdf']="$base/Env_Vars_Attacks.pdf"
            ['Sshock.pdf']="$base/Sshock.pdf"
            ['Buffer Overflow.pdf']="$base/Buffer%20Overflow.pdf"
            ['Scode.pdf']="$base/Scode.pdf"
            ['Return-to-libc.pdf']="$base/Return-to-libc.pdf"
            ['Protections_Buffer Overflow.pdf']="$base/Protections_Buffer%20Overflow.pdf"
            ['FString_Attacks.pdf']="$base/FString_Attacks.pdf"
            ['SS_Vulnerabilities.pdf']="$base/SS_Vulnerabilities.pdf"
            ['Race Condition.pdf']="$base/Race%20Condition.pdf"
            ['SQL Injection.pdf']="$base/SQL%20Injection.pdf"
            ['XSS.pdf']="$base/XSS.pdf"
          )

          for name in "${!files[@]}"; do
            echo "Fetching $name"
            tmp="materials/.tmp-${name// /_}"
            code="$(curl --silent --show-error --location --retry 2 \
              --user-agent 'UAIC-course-archive/1.0' \
              --write-out '%{http_code}' --output "$tmp" "${files[$name]}" || true)"

            if [ "$code" = '200' ] && [ "$(head -c 4 "$tmp" 2>/dev/null || true)" = '%PDF' ]; then
              mv "$tmp" "materials/$name"
              printf '| %s | %s | archived |\n' "$name" "$code" >> "$status"
            else
              rm -f "$tmp"
              printf '| %s | %s | unavailable from current URL |\n' "$name" "${code:-error}" >> "$status"
            fi
          done

          if compgen -G 'materials/*.pdf' > /dev/null; then
            sha256sum materials/*.pdf > materials/SHA256SUMS.txt
          fi

          cat "$status"
          ls -lh materials

      - name: Commit material snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f materials/
          if git diff --cached --quiet; then
            echo 'No material changes.'
            exit 0
          fi
          git commit -m 'Archive currently available Software Security materials [skip ci]'
          git push
